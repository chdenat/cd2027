name: Deploy cd2027.christinedeloupy.fr

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # WordPress dispatches after it has safely queued a public content change.
  repository_dispatch:
    types: [cd2027_deploy]
  schedule:
    - cron: '17 6 * * *'

permissions:
  # The build consumes content and deployment secrets; the GitHub checkout token is read-only.
  contents: read

concurrency:
  group: cd2027-deployment
  # Never cancel a live promotion; serialize builds so current cannot point to an incomplete release.
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: cd2027
    env:
      # Environment-scoped values keep staging separate from production.
      SITE_URL: ${{ vars.SITE_URL || 'https://cd2027.christinedeloupy.fr' }}
      WORDPRESS_ORIGIN: ${{ vars.WORDPRESS_ORIGIN || 'https://christinedeloupy.fr' }}
      WORDPRESS_CONTENT_MODE: ${{ vars.WORDPRESS_CONTENT_MODE || 'auto' }}
      WORDPRESS_API_USERNAME: ${{ secrets.WORDPRESS_API_USERNAME }}
      WORDPRESS_API_APPLICATION_PASSWORD: ${{ secrets.WORDPRESS_API_APPLICATION_PASSWORD }}
      CD2027_WP_AUTH: '1'
      PRIVATE_VIEW: ${{ vars.PRIVATE_VIEW || 'true' }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Configure Font Awesome Pro access
        env:
          FONTAWESOME_PACKAGE_TOKEN: ${{ secrets.FONTAWESOME_PACKAGE_TOKEN }}
        run: |
          if [ -z "$FONTAWESOME_PACKAGE_TOKEN" ]; then
            echo "The FONTAWESOME_PACKAGE_TOKEN Actions secret is required to install Font Awesome Pro." >&2
            exit 1
          fi
          printf '%s\n' '@fortawesome:registry=https://npm.fontawesome.com/' "//npm.fontawesome.com/:_authToken=${FONTAWESOME_PACKAGE_TOKEN}" > "$HOME/.npmrc"
          chmod 600 "$HOME/.npmrc"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Build and validate all generated routes
        run: bun run check

      - name: Install password-based SSH client
        run: sudo apt-get update && sudo apt-get install --yes sshpass

      - name: Upload and atomically promote the CD2027 build
        env:
          CD2027_SSH_HOST: ${{ secrets.CD2027_SSH_HOST }}
          CD2027_SSH_PORT: ${{ secrets.CD2027_SSH_PORT }}
          CD2027_SSH_USER: ${{ secrets.CD2027_SSH_USER }}
          CD2027_SSH_PASSWORD: ${{ secrets.CD2027_SSH_PASSWORD }}
          CD2027_REMOTE_ROOT: ${{ vars.CD2027_REMOTE_ROOT }}
        run: bash scripts/upload-cd2027.sh
